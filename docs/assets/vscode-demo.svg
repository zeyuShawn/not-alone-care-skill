<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">VS Code demo of You Are Not Alone skill</title>
  <desc id="desc">A stylized VS Code window showing the skill prompt, reference files, and a safe assistant response.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf4ff"/>
      <stop offset="1" stop-color="#fff3e8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#19324d" flood-opacity="0.22"/>
    </filter>
    <style>
      .mono{font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .sans{font-family: Inter,Segoe UI,Arial,sans-serif}
      .small{font-size:18px}.tiny{font-size:15px}.code{font-size:16px}
    </style>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <rect x="60" y="56" width="1080" height="608" rx="24" fill="#1e1e1e"/>
    <rect x="60" y="56" width="1080" height="46" rx="24" fill="#2d2d30"/>
    <circle cx="92" cy="79" r="7" fill="#ff5f57"/><circle cx="116" cy="79" r="7" fill="#ffbd2e"/><circle cx="140" cy="79" r="7" fill="#28c840"/>
    <text x="600" y="85" text-anchor="middle" fill="#c8c8c8" class="sans tiny">mental-care-skill — Visual Studio Code</text>
    <rect x="60" y="102" width="228" height="562" fill="#252526"/>
    <rect x="288" y="102" width="482" height="562" fill="#1e1e1e"/>
    <rect x="770" y="102" width="370" height="562" fill="#151a21"/>
    <text x="84" y="138" fill="#cccccc" class="sans tiny">EXPLORER</text>
    <text x="84" y="176" fill="#dcdcaa" class="mono code">▾ mental-care-skill</text>
    <text x="102" y="209" fill="#9cdcfe" class="mono code">▾ references</text>
    <text x="124" y="238" fill="#ce9178" class="mono tiny">triage-router.md</text>
    <text x="124" y="265" fill="#ce9178" class="mono tiny">crisis-protocol.md</text>
    <text x="124" y="292" fill="#ce9178" class="mono tiny">career-compass.md</text>
    <text x="102" y="328" fill="#9cdcfe" class="mono code">▾ scripts</text>
    <text x="124" y="357" fill="#ce9178" class="mono tiny">init_local_data.py</text>
    <text x="124" y="384" fill="#ce9178" class="mono tiny">validate_local_data.py</text>
    <text x="102" y="420" fill="#ce9178" class="mono code">SKILL.md</text>
    <text x="102" y="449" fill="#ce9178" class="mono code">README.md</text>
    <rect x="310" y="126" width="438" height="34" rx="8" fill="#2d2d30"/>
    <text x="330" y="148" fill="#d4d4d4" class="mono tiny">SKILL.md</text>
    <text x="315" y="194" fill="#6a9955" class="mono code"># Prompt in VS Code / Codex</text>
    <text x="315" y="229" fill="#d4d4d4" class="mono code">Use $mental-care-skill.</text>
    <text x="315" y="262" fill="#d4d4d4" class="mono code">Start with safety routing,</text>
    <text x="315" y="295" fill="#d4d4d4" class="mono code">then offer one tiny step.</text>
    <text x="315" y="346" fill="#569cd6" class="mono code">if</text><text x="342" y="346" fill="#d4d4d4" class="mono code"> crisis_signal:</text>
    <text x="340" y="379" fill="#dcdcaa" class="mono code">load</text><text x="386" y="379" fill="#ce9178" class="mono code"> crisis-protocol.md</text>
    <text x="315" y="429" fill="#569cd6" class="mono code">else</text><text x="356" y="429" fill="#d4d4d4" class="mono code">:</text>
    <text x="340" y="462" fill="#dcdcaa" class="mono code">offer</text><text x="394" y="462" fill="#ce9178" class="mono code"> grounding / care prep</text>
    <text x="340" y="495" fill="#dcdcaa" class="mono code">optional</text><text x="420" y="495" fill="#ce9178" class="mono code"> outing or career</text>
    <rect x="794" y="126" width="322" height="514" rx="16" fill="#f7fbff"/>
    <text x="818" y="164" fill="#1f3552" class="sans small" font-weight="700">Assistant preview</text>
    <rect x="818" y="190" width="274" height="94" rx="14" fill="#e8f0fe"/>
    <text x="838" y="222" fill="#213547" class="sans tiny">“我先帮你把负担降下来。</text>
    <text x="838" y="249" fill="#213547" class="sans tiny">现在只做一件事：把脚</text>
    <text x="838" y="276" fill="#213547" class="sans tiny">放稳，慢慢呼气。”</text>
    <rect x="818" y="314" width="274" height="84" rx="14" fill="#fff4e6"/>
    <text x="838" y="347" fill="#213547" class="sans tiny">Safety check happens first;</text>
    <text x="838" y="374" fill="#213547" class="sans tiny">modules wait until safe.</text>
    <rect x="818" y="428" width="274" height="148" rx="14" fill="#e9f7ef"/>
    <text x="838" y="462" fill="#213547" class="sans tiny">Local tools only write</text>
    <text x="838" y="489" fill="#213547" class="sans tiny">consented records:</text>
    <text x="838" y="525" fill="#116329" class="mono tiny">python scripts/init_local_data.py</text>
    <text x="838" y="552" fill="#116329" class="mono tiny">python scripts/validate_local_data.py</text>
  </g>
</svg>
