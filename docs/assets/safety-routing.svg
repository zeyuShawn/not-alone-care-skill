<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Safety routing logic</title>
  <desc id="desc">Flowchart for safety-first routing from user message to crisis, urgent, care navigation, or low-risk support.</desc>
  <defs><style>.sans{font-family:Inter,Segoe UI,Arial,sans-serif}.h{font-size:28px;font-weight:800}.t{font-size:18px}.s{font-size:15px}.box{rx:18;stroke-width:2}.arrow{stroke:#44556b;stroke-width:3;fill:none;marker-end: url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#44556b"/></marker></defs>
  <rect width="1200" height="700" fill="#fbfdff"/>
  <text x="600" y="54" text-anchor="middle" class="sans h" fill="#172a46">Safety-first Routing Logic</text>
  <rect x="465" y="92" width="270" height="82" class="box" fill="#e8f0fe" stroke="#7aa2ff"/><text x="600" y="126" text-anchor="middle" class="sans t" fill="#172a46" font-weight="700">User says something hard</text><text x="600" y="152" text-anchor="middle" class="sans s" fill="#44556b">assistant reduces cognitive load</text>
  <rect x="430" y="230" width="340" height="100" class="box" fill="#fff4e6" stroke="#f2a65a"/><text x="600" y="268" text-anchor="middle" class="sans t" fill="#172a46" font-weight="700">Silent first pass</text><text x="600" y="297" text-anchor="middle" class="sans s" fill="#44556b">danger • urgent flags • function • capacity</text>
  <path class="arrow" d="M600 174 L600 230"/>
  <rect x="60" y="420" width="245" height="122" class="box" fill="#fdecec" stroke="#ef7d7d"/><text x="182" y="455" text-anchor="middle" class="sans t" fill="#7f1d1d" font-weight="700">Immediate danger</text><text x="182" y="485" text-anchor="middle" class="sans s" fill="#44556b">crisis protocol</text><text x="182" y="512" text-anchor="middle" class="sans s" fill="#44556b">real-world help now</text>
  <rect x="335" y="420" width="245" height="122" class="box" fill="#fff7ed" stroke="#fb923c"/><text x="457" y="455" text-anchor="middle" class="sans t" fill="#7c2d12" font-weight="700">Significant risk</text><text x="457" y="485" text-anchor="middle" class="sans s" fill="#44556b">triage + support contact</text><text x="457" y="512" text-anchor="middle" class="sans s" fill="#44556b">one concrete next step</text>
  <rect x="610" y="420" width="245" height="122" class="box" fill="#fefce8" stroke="#eab308"/><text x="732" y="455" text-anchor="middle" class="sans t" fill="#713f12" font-weight="700">Persistent distress</text><text x="732" y="485" text-anchor="middle" class="sans s" fill="#44556b">care navigation</text><text x="732" y="512" text-anchor="middle" class="sans s" fill="#44556b">optional adjuncts only</text>
  <rect x="895" y="420" width="245" height="122" class="box" fill="#e9f7ef" stroke="#69b883"/><text x="1017" y="455" text-anchor="middle" class="sans t" fill="#14532d" font-weight="700">Low-risk distress</text><text x="1017" y="485" text-anchor="middle" class="sans s" fill="#44556b">self-help modules</text><text x="1017" y="512" text-anchor="middle" class="sans s" fill="#44556b">outing/career may run</text>
  <path class="arrow" d="M518 330 C390 365 250 385 182 420"/><path class="arrow" d="M570 330 C520 365 485 385 457 420"/><path class="arrow" d="M632 330 C680 365 712 385 732 420"/><path class="arrow" d="M690 330 C820 365 950 385 1017 420"/>
  <rect x="290" y="590" width="620" height="64" rx="18" fill="#eef2ff" stroke="#8796ff" stroke-width="2"/><text x="600" y="629" text-anchor="middle" class="sans t" fill="#172a46" font-weight="700">Rule: safety routing first; new modules only after the gate is safe.</text>
</svg>
