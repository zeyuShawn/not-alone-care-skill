<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Architecture map</title>
  <desc id="desc">System architecture for the mental-care skill, including safety routing, reference modules, local scripts, and isolated data stores.</desc>
  <defs><style>.sans{font-family:Inter,Segoe UI,Arial,sans-serif}.h{font-size:28px;font-weight:800}.t{font-size:18px}.s{font-size:15px}.box{rx:18;stroke-width:2}.arrow{stroke:#49647f;stroke-width:3;fill:none;marker-end: url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#49647f"/></marker></defs>
  <rect width="1200" height="760" fill="#f7fafc"/>
  <text x="600" y="56" text-anchor="middle" fill="#17324d" class="sans h">You Are Not Alone — Architecture</text>
  <rect x="60" y="100" width="260" height="116" class="box" fill="#e8f0fe" stroke="#7aa2ff"/><text x="190" y="137" text-anchor="middle" class="sans t" fill="#17324d" font-weight="700">User message</text><text x="190" y="169" text-anchor="middle" class="sans s" fill="#35506b">distress / care / outing / career</text>
  <rect x="470" y="90" width="260" height="136" class="box" fill="#fff4e6" stroke="#f2a65a"/><text x="600" y="128" text-anchor="middle" class="sans t" fill="#17324d" font-weight="700">First-pass safety router</text><text x="600" y="160" text-anchor="middle" class="sans s" fill="#35506b">risk • capacity • function</text><text x="600" y="188" text-anchor="middle" class="sans s" fill="#35506b">never exposes color labels</text>
  <rect x="880" y="100" width="260" height="116" class="box" fill="#fdecec" stroke="#ef7d7d"/><text x="1010" y="137" text-anchor="middle" class="sans t" fill="#17324d" font-weight="700">Crisis / urgent care</text><text x="1010" y="169" text-anchor="middle" class="sans s" fill="#35506b">real-world safety support</text>
  <path class="arrow" d="M320 158 C385 158 405 158 470 158"/><path class="arrow" d="M730 158 C795 158 815 158 880 158"/>
  <rect x="110" y="300" width="230" height="126" class="box" fill="#e9f7ef" stroke="#69b883"/><text x="225" y="338" text-anchor="middle" class="sans t" fill="#17324d" font-weight="700">Self-help modules</text><text x="225" y="370" text-anchor="middle" class="sans s" fill="#35506b">grounding • tiny steps</text><text x="225" y="398" text-anchor="middle" class="sans s" fill="#35506b">evening check-ins</text>
  <rect x="390" y="300" width="230" height="126" class="box" fill="#eef2ff" stroke="#8796ff"/><text x="505" y="338" text-anchor="middle" class="sans t" fill="#17324d" font-weight="700">Care navigation</text><text x="505" y="370" text-anchor="middle" class="sans s" fill="#35506b">clinician notes</text><text x="505" y="398" text-anchor="middle" class="sans s" fill="#35506b">support network</text>
  <rect x="670" y="300" width="230" height="126" class="box" fill="#f0fdfa" stroke="#4db6ac"/><text x="785" y="338" text-anchor="middle" class="sans t" fill="#17324d" font-weight="700">Gentle Outing</text><text x="785" y="370" text-anchor="middle" class="sans s" fill="#35506b">minimum plan</text><text x="785" y="398" text-anchor="middle" class="sans s" fill="#35506b">retreat point</text>
  <rect x="950" y="300" width="200" height="126" class="box" fill="#fff7ed" stroke="#f59e0b"/><text x="1050" y="338" text-anchor="middle" class="sans t" fill="#17324d" font-weight="700">Career Compass</text><text x="1050" y="370" text-anchor="middle" class="sans s" fill="#35506b">job fit</text><text x="1050" y="398" text-anchor="middle" class="sans s" fill="#35506b">local code evidence</text>
  <path class="arrow" d="M600 226 C600 255 225 260 225 300"/><path class="arrow" d="M600 226 C600 255 505 260 505 300"/><path class="arrow" d="M600 226 C600 255 785 260 785 300"/><path class="arrow" d="M600 226 C600 255 1050 260 1050 300"/>
  <rect x="90" y="535" width="300" height="130" class="box" fill="#ffffff" stroke="#cbd5e1"/><text x="240" y="573" text-anchor="middle" class="sans t" fill="#17324d" font-weight="700">Local scripts</text><text x="240" y="606" text-anchor="middle" class="sans s" fill="#35506b">append • validate • delete</text><text x="240" y="633" text-anchor="middle" class="sans s" fill="#35506b">export • rank • analyze</text>
  <rect x="450" y="535" width="300" height="130" class="box" fill="#ffffff" stroke="#cbd5e1"/><text x="600" y="573" text-anchor="middle" class="sans t" fill="#17324d" font-weight="700">Consent + privacy firewall</text><text x="600" y="606" text-anchor="middle" class="sans s" fill="#35506b">no silent saves</text><text x="600" y="633" text-anchor="middle" class="sans s" fill="#35506b">no mental-health/job mixing</text>
  <rect x="810" y="535" width="300" height="130" class="box" fill="#ffffff" stroke="#cbd5e1"/><text x="960" y="573" text-anchor="middle" class="sans t" fill="#17324d" font-weight="700">Isolated data stores</text><text x="960" y="606" text-anchor="middle" class="sans s" fill="#35506b">CSV logs + JSON stores</text><text x="960" y="633" text-anchor="middle" class="sans s" fill="#35506b">~/mental_care_data</text>
  <path class="arrow" d="M505 426 C465 480 325 490 240 535"/><path class="arrow" d="M785 426 C755 480 670 490 600 535"/><path class="arrow" d="M1050 426 C1035 480 1000 490 960 535"/><path class="arrow" d="M390 600 C410 600 430 600 450 600"/><path class="arrow" d="M750 600 C770 600 790 600 810 600"/>
</svg>
